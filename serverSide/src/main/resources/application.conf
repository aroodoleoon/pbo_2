ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.pos.server.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://"${?POSTGRES_HOST:-"localhost"}":"${?POSTGRES_PORT:-"5432"}"/"${?POSTGRES_DB:-"pos_db"}
    user = ${?POSTGRES_USER:-"pos_app"}
    password = ${?POSTGRES_PASSWORD:-"pos_password"}
}

