services:
  postgres:
    image: postgres:17-alpine
    container_name: pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_db}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_app} -d ${POSTGRES_DB:-pos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./serverSide
      dockerfile: Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pos_db}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/pos_logs}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started

  mongodb:
    image: mongo:7.0-jammy
    container_name: pos-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pos_logs

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pos-client
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8080/api/v1
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:

